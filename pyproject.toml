[project]
name = "biocore"
version = "0.0.1"
description = "Organism-agnostic bioinformatics mechanism shared by MethylAsk, GeneAsk, and seagrass"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
modbam = ["pysam"]     # ONT modBAM MM/ML reader (biocore.io.modbam); imported lazily
variants = ["pysam"]   # VCF carried-variant extractor (biocore.variants.carried)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Non-Python files ship only when listed here. An editable install reads them from
# the checkout, so a missing entry passes CI and breaks every image (pip install .).
[tool.setuptools.package-data]
"biocore.report" = ["data/*.json"]
